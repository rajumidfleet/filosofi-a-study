name: Study guide checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.8.1
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node --test --experimental-test-coverage --test-coverage-include='guide/core.mjs' --test-coverage-lines=90 --test-coverage-functions=90 --test-coverage-branches=80 tests/guide.test.mjs
      - run: node --test --experimental-test-coverage --test-coverage-include='guide/glossary-core.mjs' --test-coverage-lines=90 --test-coverage-functions=90 --test-coverage-branches=80 tests/glossary.test.mjs
      - run: git diff --exit-code -- guide.html
      - run: npm audit --audit-level=high
